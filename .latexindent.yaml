# Keep publication text and literal examples intact; format the surrounding TeX structure.
defaultIndent: '  '
verbatimEnvironments:
  verbatim: 1
  verbatim*: 1
  Verbatim: 1
  BVerbatim: 1
  SaveVerbatim: 1
  minted: 1
  lstlisting: 1
  luacode: 1
  luacode*: 1
  filecontents: 1
  filecontents*: 1
removeTrailingWhitespace:
  beforeProcessing: 0
  afterProcessing: 1
modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 0
