<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240" role="img" aria-labelledby="title desc">
<title id="title">Bit order within an original and mirrored row</title>
<desc id="desc">The original row is 00010110 and the mirrored row is 01101000. Both are shown from left to right, bit 7 through bit 0.</desc>
<rect width="700" height="240" fill="white"/>
<text x="15" y="81" font-family="sans-serif" font-size="22">Original 0x16</text>
<rect x="230" y="55" width="50" height="50" fill="white" stroke="#111"/><text x="255" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="255" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">7</text>
<rect x="280" y="55" width="50" height="50" fill="white" stroke="#111"/><text x="305" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="305" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">6</text>
<rect x="330" y="55" width="50" height="50" fill="white" stroke="#111"/><text x="355" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="355" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">5</text>
<rect x="380" y="55" width="50" height="50" fill="#111" stroke="#111"/><text x="405" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1</text><text x="405" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">4</text>
<rect x="430" y="55" width="50" height="50" fill="white" stroke="#111"/><text x="455" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="455" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">3</text>
<rect x="480" y="55" width="50" height="50" fill="#111" stroke="#111"/><text x="505" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1</text><text x="505" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">2</text>
<rect x="530" y="55" width="50" height="50" fill="#111" stroke="#111"/><text x="555" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1</text><text x="555" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">1</text>
<rect x="580" y="55" width="50" height="50" fill="white" stroke="#111"/><text x="605" y="88" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="605" y="43" text-anchor="middle" font-family="sans-serif" font-size="16">0</text>
<text x="15" y="181" font-family="sans-serif" font-size="22">Mirrored 0x68</text>
<rect x="230" y="155" width="50" height="50" fill="white" stroke="#111"/><text x="255" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="255" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">7</text>
<rect x="280" y="155" width="50" height="50" fill="#111" stroke="#111"/><text x="305" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1</text><text x="305" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">6</text>
<rect x="330" y="155" width="50" height="50" fill="#111" stroke="#111"/><text x="355" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1</text><text x="355" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">5</text>
<rect x="380" y="155" width="50" height="50" fill="white" stroke="#111"/><text x="405" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="405" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">4</text>
<rect x="430" y="155" width="50" height="50" fill="#111" stroke="#111"/><text x="455" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="white">1</text><text x="455" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">3</text>
<rect x="480" y="155" width="50" height="50" fill="white" stroke="#111"/><text x="505" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="505" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">2</text>
<rect x="530" y="155" width="50" height="50" fill="white" stroke="#111"/><text x="555" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="555" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">1</text>
<rect x="580" y="155" width="50" height="50" fill="white" stroke="#111"/><text x="605" y="188" text-anchor="middle" font-family="monospace" font-size="25" fill="#111">0</text><text x="605" y="143" text-anchor="middle" font-family="sans-serif" font-size="16">0</text>
</svg>
