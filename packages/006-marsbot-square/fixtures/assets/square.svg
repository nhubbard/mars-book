<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" role="img" aria-labelledby="t d"><title id="t">Square in screen coordinates</title><desc id="d">Origin at upper left. East to L zero, south to L L, west to zero L, north to origin. Positive x right and y down.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs><rect width="820" height="640" fill="white"/><g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M170 110H730"/><path d="M190 90V590"/></g><g stroke="#222" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M190 110H570"/><path d="M570 110V450"/><path d="M570 450H190"/><path d="M190 450V110"/></g><g font-family="sans-serif" font-size="21" fill="#111"><text x="735" y="117">x</text><text x="181" y="619">y</text><text x="105" y="78">(0, 0)</text><text x="575" y="78">(L, 0)</text><text x="585" y="490">(L, L)</text><text x="90" y="490">(0, L)</text><text x="305" y="90">east: 90°</text><text x="590" y="285">south: 180°</text><text x="300" y="495">west: 270°</text><text x="35" y="285">north: 0°</text><text x="175" y="550">Side length L; positive y points down</text></g></svg>
