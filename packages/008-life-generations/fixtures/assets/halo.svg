<svg xmlns="http://www.w3.org/2000/svg" width="700" height="710" viewBox="0 0 700 710" role="img" aria-labelledby="t d"><title id="t">Dead halo and neighbor offsets</title><desc id="d">Ten by ten byte board. Outer border is permanently dead; inner eight by eight are cells. A marked interior center C is surrounded by offsets minus 11, minus 10, minus 9, minus 1, plus 1, plus 9, plus 10, plus 11. Center is not counted.</desc><rect width="700" height="710" fill="white"/><rect x="100" y="100" width="480" height="480" fill="#ededed"/><rect x="148" y="148" width="384" height="384" fill="white"/><rect x="244" y="244" width="144" height="144" fill="#d2d2d2"/><g stroke="#777"><path d="M100 100V580 M100 100H580"/><path d="M148 100V580 M100 148H580"/><path d="M196 100V580 M100 196H580"/><path d="M244 100V580 M100 244H580"/><path d="M292 100V580 M100 292H580"/><path d="M340 100V580 M100 340H580"/><path d="M388 100V580 M100 388H580"/><path d="M436 100V580 M100 436H580"/><path d="M484 100V580 M100 484H580"/><path d="M532 100V580 M100 532H580"/><path d="M580 100V580 M100 580H580"/></g><rect x="292" y="292" width="48" height="48" fill="none" stroke="#111" stroke-width="3"/><g font-family="sans-serif" font-size="16" fill="#111" text-anchor="middle"><text x="268" y="274">−11</text><text x="316" y="274">−10</text><text x="364" y="274">−9</text><text x="268" y="322">−1</text><text x="316" y="322">C</text><text x="364" y="322">+1</text><text x="268" y="370">+9</text><text x="316" y="370">+10</text><text x="364" y="370">+11</text><text x="172" y="86">0</text><text x="82" y="178">0</text><text x="220" y="86">1</text><text x="82" y="226">1</text><text x="268" y="86">2</text><text x="82" y="274">2</text><text x="316" y="86">3</text><text x="82" y="322">3</text><text x="364" y="86">4</text><text x="82" y="370">4</text><text x="412" y="86">5</text><text x="82" y="418">5</text><text x="460" y="86">6</text><text x="82" y="466">6</text><text x="508" y="86">7</text><text x="82" y="514">7</text><text x="340" y="35" font-size="22">Physical row stride: ten bytes</text><text x="340" y="625" font-size="20">Dead halo: 36 bytes; logical interior: 8 × 8</text><text x="340" y="663" font-size="19">Offsets are from C; C is not a neighbor</text></g></svg>
