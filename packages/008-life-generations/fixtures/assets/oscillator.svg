0 195H832"/><path d="M784 75V267 M640 219H832"/><path d="M808 75V267 M640 243H832"/><path d="M832 75V267 M640 267H832"/></g><text x="736" y="40" font-family="sans-serif" font-size="19" text-anchor="middle">Generation 2: A current</text><text x="440" y="320" font-family="sans-serif" font-size="20" text-anchor="middle">Filled cells are alive; generation 2 follows two complete evolution steps</text></svg>
