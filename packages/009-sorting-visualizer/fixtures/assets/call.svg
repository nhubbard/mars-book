<svg xmlns="http://www.w3.org/2000/svg" width="840" height="740" viewBox="0 0 840 740" role="img" aria-labelledby="t d"><title id="t">Leaf-renderer call timeline</title><desc id="d">Arguments, link, caller delay slot, renderer work and ready checkpoint, return and return delay slot, then continuation. Saved registers are preserved by the function contract.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="840" height="740" fill="white"/><rect x="60" y="20" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="54" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">Caller prepares a0 (pointer) and a1 (count)</text><path d="M420 76V97" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="100" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="134" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">jal at P writes ra = P + 8</text><path d="M420 156V177" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="180" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="214" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">nop at P + 4 executes before the callee</text><path d="M420 236V257" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="260" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="294" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">Renderer uses scratch registers and writes 64 words</text><path d="M420 316V337" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="340" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="374" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">sort_ready: the complete frame can be inspected</text><path d="M420 396V417" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="420" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="454" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">jr ra schedules the return</text><path d="M420 476V497" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="500" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="534" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">The return delay-slot nop executes</text><path d="M420 556V577" stroke="#111" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="580" width="720" height="56" fill="#f5f5f5" stroke="#222"/><text x="420" y="614" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">Caller continues at P + 8; saved registers and sp survive</text><text x="420" y="700" font-family="sans-serif" font-size="18" text-anchor="middle">Jumps transfer control; the function body enforces register preservation</text></svg>
