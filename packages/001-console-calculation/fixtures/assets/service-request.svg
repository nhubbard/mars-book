<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="title desc">
<title id="title">A print string request combines a selector and an address</title>
<desc id="desc">Register v0 holds selector 4. Register a0 holds the prompt address. Both feed a syscall request, which appends the prompt text to console output.</desc>
<rect width="760" height="260" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2"><rect x="20" y="30" width="245" height="65"/><rect x="20" y="145" width="245" height="65"/><rect x="355" y="90" width="130" height="65"/><rect x="565" y="90" width="175" height="65"/><path d="M265 62 H310 V110 H345 M335 102 L347 110 L335 118 M265 177 H310 V135 H345 M335 127 L347 135 L335 143 M485 122 H555 M545 114 L557 122 L545 130"/></g>
<g font-family="sans-serif" font-size="19" fill="#111" text-anchor="middle"><text x="142" y="70">$v0 = 4</text><text x="142" y="184">$a0 = prompt address</text><text x="420" y="130">syscall</text><text x="652" y="118">Append prompt</text><text x="652" y="143">to console</text><text x="380" y="246">State immediately before the request</text></g></svg>
