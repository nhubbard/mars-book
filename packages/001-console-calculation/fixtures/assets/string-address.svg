<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="title desc">
<title id="title">An address points to the first byte of a string</title>
<desc id="desc">Register a0 contains address A. An arrow points to byte 48, ASCII H, followed by byte 69, ASCII i, and the terminating byte 00 at addresses A, A plus 1, and A plus 2.</desc>
<rect width="760" height="240" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2"><rect x="25" y="85" width="150" height="65"/><path d="M175 117 H280 M270 109 L282 117 L270 125"/><rect x="285" y="85" width="130" height="65"/><rect x="415" y="85" width="130" height="65"/><rect x="545" y="85" width="130" height="65"/></g>
<g font-family="sans-serif" font-size="20" fill="#111" text-anchor="middle"><text x="100" y="60">Register $a0</text><text x="100" y="125">A</text><text x="350" y="60">A</text><text x="480" y="60">A + 1</text><text x="610" y="60">A + 2</text><text x="350" y="125">48</text><text x="480" y="125">69</text><text x="610" y="125">00</text><text x="350" y="184">H</text><text x="480" y="184">i</text><text x="610" y="184">Terminator</text><text x="480" y="222">Bytes shown in hexadecimal</text></g></svg>
