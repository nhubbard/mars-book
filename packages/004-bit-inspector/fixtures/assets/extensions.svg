<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
<title id="title">Two extensions of the same 32-bit word</title>
<desc id="desc">For source word ffffffff, lw produces high half ffffffff and low half ffffffff; lwu produces high half 00000000 and the same low half ffffffff.</desc>
<rect width="760" height="280" fill="white"/>
<g font-family="sans-serif" font-size="22" fill="#111"><text x="275" y="38">Upper 32 bits</text><text x="515" y="38">Lower 32 bits</text></g>
<text x="15" y="108" font-family="sans-serif" font-size="22">$s0 after lw</text>
<rect x="220" y="70" width="240" height="62" fill="white" stroke="#111" stroke-width="2"/><text x="340" y="111" font-family="monospace" font-size="29" text-anchor="middle" fill="#111">ffffffff</text>
<rect x="460" y="70" width="240" height="62" fill="white" stroke="#111" stroke-width="2"/><text x="580" y="111" font-family="monospace" font-size="29" text-anchor="middle" fill="#111">ffffffff</text>
<text x="15" y="203" font-family="sans-serif" font-size="22">$s1 after lwu</text>
<rect x="220" y="165" width="240" height="62" fill="white" stroke="#111" stroke-width="2"/><text x="340" y="206" font-family="monospace" font-size="29" text-anchor="middle" fill="#111">00000000</text>
<rect x="460" y="165" width="240" height="62" fill="white" stroke="#111" stroke-width="2"/><text x="580" y="206" font-family="monospace" font-size="29" text-anchor="middle" fill="#111">ffffffff</text>
<text x="380" y="260" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#111">Values shown in hexadecimal</text></svg>
