<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" aria-labelledby="title desc"><title id="title">Seven-segment bit assignments</title><desc id="desc">Top a bit 0; upper right b bit 1; lower right c bit 2; bottom d bit 3; lower left e bit 4; upper left f bit 5; middle g bit 6; decimal point bit 7.</desc><rect width="680" height="540" fill="white"/><g stroke="#222" stroke-width="13" stroke-linecap="round"><path d="M250 80H410 M430 100V240 M430 280V420 M250 440H410 M230 280V420 M230 100V240 M250 260H410"/></g><circle cx="475" cy="440" r="9" fill="#222"/><g font-family="sans-serif" font-size="22" fill="#111"><text x="280" y="45">a: bit 0</text><text x="460" y="180">b: bit 1</text><text x="460" y="350">c: bit 2</text><text x="280" y="490">d: bit 3</text><text x="75" y="350">e: bit 4</text><text x="75" y="180">f: bit 5</text><text x="280" y="240">g: bit 6</text><text x="485" y="490">dp: bit 7</text></g></svg>
