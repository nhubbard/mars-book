[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-book-highlight"
version = "0.1.0"
description = "Minted rendering of source spans exported by the MARS IntelliJ highlighter"
requires-python = ">=3.11"
dependencies = ["Pygments==2.19.2"]

[project.entry-points."pygments.lexers"]
mars-idea = "mars_book_highlight:MarsIdeaLexer"

[project.entry-points."pygments.styles"]
mars-idea-light = "mars_book_highlight.style:MarsIdeaLightStyle"
