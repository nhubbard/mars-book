name: Validate book packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/course.py validate
      - run: python3 tools/course.py validate --package 002-single-pixel
      - run: python3 tools/course.py validate --package 003-eight-byte-sprite
      - run: python3 tools/course.py validate --package 004-bit-inspector
      - run: python3 tools/course.py validate --package 005-seven-segment-counter
      - run: python3 tools/course.py validate --package 006-marsbot-square
      - run: python3 tools/course.py validate --package 007-bresenham-line
      - run: python3 tools/course.py validate --package 008-life-generations
      - run: python3 tools/course.py validate --package 009-sorting-visualizer
      - run: python3 tools/course.py validate --package 010-maze-explorer
      - run: python3 tools/course.py validate --package 011-matrix-transpose
      - run: python3 tools/course.py validate --package 012-fixed-point-ball
      - run: python3 tools/course.py validate --package 013-binary-packet-parser
      - run: python3 tools/course.py validate --package 014-ring-buffer-logger
      - run: python3 tools/course.py validate --package 015-utf8-scanner
      - run: python3 tools/course.py validate --package 016-clipped-sprite-blitter
      - run: python3 tools/course.py validate --package 017-expression-evaluator
      - run: python3 tools/course.py validate --package 020-pcm-mixing
      - run: python3 tools/course.py validate --package 021-fixed-point-fir
      - run: python3 tools/course.py validate --package 022-blocked-matmul
      - run: python3 tools/course.py validate --package 023-delta-varint
      - run: python3 tools/course.py validate --package 024-crc32
      - run: python3 tools/course.py validate --package 025-sha256
      - run: python3 tools/course.py validate --package 026-chacha20
      - run: python3 tools/course.py validate --package 027-rsa-arithmetic
      - run: python3 tools/course.py validate --package 028-base64
      - run: python3 tools/course.py validate --package 029-binary-ppm
      - run: python3 tools/course.py validate --package 030-qoi
      - run: python3 tools/course.py validate --package 031-pcm-wav
      - run: python3 tools/course.py validate --package 032-cbor-telemetry
      - run: python3 tools/course.py validate --package 033-png
      - run: python3 tools/course.py validate --package 034-lossless-video
      - run: python3 tools/course.py validate --package 035-h263
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/book.py validate
      - run: python3 tools/book.py validate --entry specimen.tex
      - run: python3 tools/book.py validate --entry drafts/blocked-matmul.tex
      - run: python3 tools/book.py validate --entry drafts/delta-varint.tex
      - run: python3 tools/book.py validate --entry drafts/crc32.tex
      - run: python3 tools/book.py validate --entry drafts/sha256.tex
      - run: python3 tools/book.py validate --entry drafts/chacha20.tex
      - run: python3 tools/book.py validate --entry drafts/rsa-arithmetic.tex
      - run: python3 tools/book.py validate --entry drafts/base64.tex
      - run: python3 tools/book.py validate --entry drafts/binary-ppm.tex
      - run: python3 tools/book.py validate --entry drafts/qoi.tex
      - run: python3 tools/book.py validate --entry drafts/pcm-wav.tex
      - run: python3 tools/book.py validate --entry drafts/pcm-wav-assignment.tex
      - run: python3 tools/book.py validate --entry drafts/cbor-telemetry.tex
      - run: python3 tools/book.py validate --entry drafts/cbor-assignment.tex
