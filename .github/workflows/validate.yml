name: Validate book packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/course.py validate
      - run: python3 tools/course.py validate --package 002-single-pixel
      - run: python3 tools/course.py validate --package 003-eight-byte-sprite
      - run: python3 tools/course.py validate --package 004-bit-inspector
      - run: python3 tools/course.py validate --package 005-seven-segment-counter
      - run: python3 tools/course.py validate --package 006-marsbot-square
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/course.py book
      - run: python3 tools/course.py build
      - run: python3 tools/course.py build --package 002-single-pixel
      - run: python3 tools/course.py build --package 003-eight-byte-sprite
      - run: python3 tools/course.py build --package 004-bit-inspector
      - run: python3 tools/course.py build --package 005-seven-segment-counter
      - run: python3 tools/course.py build --package 006-marsbot-square
