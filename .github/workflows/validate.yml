      - run: python3 tools/book.py validate --entry drafts/seven-before-write-figure.tex
      - run: python3 tools/book.py validate --entry drafts/seven-zero-glyph-figure.tex
      - run: python3 tools/book.py validate --entry drafts/seven-a-glyph-figure.tex
      - run: python3 tools/book.py validate --entry drafts/seven-final-f-figure.tex
