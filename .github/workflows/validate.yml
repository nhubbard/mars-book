name: Validate book packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/course.py validate
      - run: python3 tools/course.py validate --package 002-single-pixel
      - run: python3 tools/course.py validate --package 003-eight-byte-sprite
      - run: python3 tools/course.py validate --package 004-bit-inspector
      - run: python3 tools/course.py validate --package 005-seven-segment-counter
      - run: python3 tools/course.py validate --package 006-marsbot-square
      - run: python3 tools/course.py validate --package 007-bresenham-line
      - run: python3 tools/course.py validate --package 008-life-generations
      - run: python3 tools/course.py validate --package 009-sorting-visualizer
      - run: python3 tools/course.py validate --package 010-maze-explorer
      - run: python3 tools/course.py validate --package 011-matrix-transpose
      - run: python3 tools/course.py validate --package 012-fixed-point-ball
      - run: python3 tools/course.py validate --package 013-binary-packet-parser
      - run: python3 tools/course.py validate --package 014-ring-buffer-logger
      - run: python3 tools/course.py validate --package 015-utf8-scanner
      - run: python3 tools/course.py validate --package 016-clipped-sprite-blitter
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/book.py validate
      - run: python3 tools/book.py validate --entry specimen.tex
      - run: python3 -m pip install ./tools/pygments
      - run: python3 -m unittest discover -s tools/pygments/tests
      - run: python3 tools/course.py build
      - run: python3 tools/course.py build --package 002-single-pixel
      - run: python3 tools/course.py build --package 003-eight-byte-sprite
      - run: python3 tools/course.py build --package 004-bit-inspector
      - run: python3 tools/course.py build --package 005-seven-segment-counter
      - run: python3 tools/course.py build --package 006-marsbot-square
      - run: python3 tools/course.py build --package 007-bresenham-line
      - run: python3 tools/course.py build --package 008-life-generations
      - run: python3 tools/course.py build --package 009-sorting-visualizer
      - run: python3 tools/course.py build --package 010-maze-explorer
      - run: python3 tools/course.py build --package 011-matrix-transpose
      - run: python3 tools/course.py build --package 012-fixed-point-ball
      - run: python3 tools/course.py build --package 013-binary-packet-parser
      - run: python3 tools/course.py build --package 014-ring-buffer-logger
      - run: python3 tools/course.py build --package 015-utf8-scanner
      - run: python3 tools/course.py build --package 016-clipped-sprite-blitter
