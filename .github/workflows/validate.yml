      - run: python3 tools/book.py validate --entry drafts/h263-motion-result-figure.tex
      - run: python3 tools/book.py validate --entry drafts/h263-prediction-residual-figure.tex
      - run: python3 tools/book.py validate --entry drafts/h263-block-reconstruction-figure.tex
      - run: python3 tools/book.py validate --entry drafts/h263-coefficient-bits-figure.tex
      - run: python3 tools/book.py validate --entry drafts/h263-clip-accepted-figure.tex
      - run: python3 -m pip install ./tools/pygments
      - run: python3 -m unittest discover -s tools/pygments/tests
      - run: python3 tools/course.py build
      - run: python3 tools/course.py build --package 002-single-pixel
      - run: python3 tools/course.py build --package 003-eight-byte-sprite
      - run: python3 tools/course.py build --package 004-bit-inspector
      - run: python3 tools/course.py build --package 005-seven-segment-counter
      - run: python3 tools/course.py build --package 006-marsbot-square
      - run: python3 tools/course.py build --package 007-bresenham-line
      - run: python3 tools/course.py build --package 008-life-generations
      - run: python3 tools/course.py build --package 009-sorting-visualizer
      - run: python3 tools/course.py build --package 010-maze-explorer
      - run: python3 tools/course.py build --package 011-matrix-transpose
      - run: python3 tools/course.py build --package 012-fixed-point-ball
      - run: python3 tools/course.py build --package 013-binary-packet-parser
      - run: python3 tools/course.py build --package 014-ring-buffer-logger
      - run: python3 tools/course.py build --package 015-utf8-scanner
      - run: python3 tools/course.py build --package 016-clipped-sprite-blitter
      - run: python3 tools/course.py build --package 017-expression-evaluator
      - run: python3 tools/course.py build --package 020-pcm-mixing
      - run: python3 tools/course.py build --package 021-fixed-point-fir
      - run: python3 tools/course.py build --package 022-blocked-matmul
      - run: python3 tools/course.py build --package 023-delta-varint
      - run: python3 tools/course.py build --package 024-crc32
      - run: python3 tools/course.py build --package 025-sha256
      - run: python3 tools/course.py build --package 026-chacha20
      - run: python3 tools/course.py build --package 027-rsa-arithmetic
      - run: python3 tools/course.py build --package 028-base64
      - run: python3 tools/course.py build --package 029-binary-ppm
      - run: python3 tools/course.py build --package 030-qoi
      - run: python3 tools/course.py build --package 031-pcm-wav
      - run: python3 tools/course.py build --package 032-cbor-telemetry
      - run: python3 tools/course.py build --package 033-png
      - run: python3 tools/course.py build --package 034-lossless-video
      - run: python3 tools/course.py build --package 035-h263
